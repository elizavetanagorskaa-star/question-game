<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Вопросики</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="app">

        <section id="categories-screen">

            <h1 class="scrapbook-title" aria-label="Вопросики">
                <span class="letter letter-1">В</span>
                <span class="letter letter-2">о</span>
                <span class="letter letter-3">п</span>
                <span class="letter letter-4">р</span>
                <span class="letter letter-5">о</span>
                <span class="letter letter-6">с</span>
                <span class="letter letter-7">и</span>
                <span class="letter letter-8">к</span>
                <span class="letter letter-9">и</span>
            </h1>

            <p>Выбери тему</p>

            <div id="categories"></div>

        </section>


        <section id="game-screen" class="hidden">

            <button id="back-button">←</button>

            <div id="cards-container"></div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
